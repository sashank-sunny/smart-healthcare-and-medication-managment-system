<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MediGuide - Patient & Doctor Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body style="min-height:100vh; display:flex; align-items:center; justify-content:center; padding:1.5rem; background:linear-gradient(135deg, #f0fdfa 0%, #e0f2fe 100%);">
  <div style="background:white; border-radius:18px; box-shadow:var(--shadow-lg); border:1px solid var(--border); max-width:440px; width:100%; overflow:hidden;">
    <div style="height:5px; background:linear-gradient(90deg, #14b8a6, #06b6d4, #3b82f6);"></div>
    <div style="padding:1.8rem;">
      <div style="text-align:center; margin-bottom:1.2rem;">
        <div style="font-size:2.2rem; margin-bottom:0.2rem;">🩺</div>
        <h1 style="font-size:1.6rem; color:var(--teal-dark); margin-bottom:0.15rem;">MediGuide</h1>
        <p style="font-size:0.85rem; font-weight:700; color:#0f766e;">"Your Health, Our Reminder."</p>
        <p style="font-size:0.75rem; color:var(--muted);">Smart medical guidance and timely medication reminders, all in one place</p>
      </div>
      <div style="display:flex; border-bottom:2px solid var(--border); margin-bottom:1.2rem;">
        <button id="tab-btn-signin" class="auth-tab active" onclick="toggleAuthTab('signin')">Sign In</button>
        <button id="tab-btn-signup" class="auth-tab" onclick="toggleAuthTab('signup')">Sign Up (Verified)</button>
      </div>
      <form id="form-signin" onsubmit="handleLoginSubmit(event)">
        <input type="text" id="login-user" class="search-input" placeholder="Username or Email" required style="margin-bottom:0.7rem; border-radius:10px;">
        <input type="password" id="login-pass" class="search-input" placeholder="Password" required style="margin-bottom:1rem; border-radius:10px;">
        <button type="submit" class="btn-primary" style="margin-bottom:0.6rem;">🔐 Sign In to Portal</button>
        <button type="button" class="btn-scan" style="width:100%; border-radius:10px;" onclick="doDemoLoginRedirect()">⚡ 1-Click Demo Login (Dr. Sashank Sunny)</button>
      </form>
      <form id="form-signup" onsubmit="handleRegisterSubmit(event)" style="display:none;">
        <input type="text" id="reg-name" class="search-input" placeholder="Full Name" required style="margin-bottom:0.6rem; border-radius:10px;">
        <input type="email" id="reg-email" class="search-input" placeholder="Verified Email" required style="margin-bottom:0.6rem; border-radius:10px;">
        <input type="password" id="reg-pass" class="search-input" placeholder="Create Password" required style="margin-bottom:0.6rem; border-radius:10px;">
        <div style="display:flex; gap:0.4rem; margin-bottom:0.6rem;">
          <input type="text" id="reg-otp" class="search-input" placeholder="6-digit OTP" style="flex:1; border-radius:10px;">
          <button type="button" class="btn-scan" style="border-radius:10px; font-size:0.76rem;" onclick="requestEmailOtp()">Get OTP</button>
        </div>
        <button type="submit" class="btn-primary">✔ Verify & Register</button>
      </form>
      <div style="text-align:center; margin-top:1.2rem; border-top:1px solid var(--border); padding-top:0.8rem;">
        <a href="index.html" style="color:#0f766e; font-weight:700; text-decoration:none; font-size:0.85rem;">← Enter MediGuide Portal as Guest</a>
      </div>
    </div>
  </div>
  <script src="app.js"></script>
  <script>function handleLoginSubmit(e){handleLogin(e);location.href='index.html#profile';} function handleRegisterSubmit(e){handleRegistration(e);location.href='index.html#profile';} function doDemoLoginRedirect(){doDemoLogin();location.href='index.html#profile';}</script>
</body>
</html>
